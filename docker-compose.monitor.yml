version: '3.8'
services:
  dex-monitor:
    build: .
    environment:
      - RPC_URL=${RPC_URL}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./monitor:/app
    command: node monitor/DEXMonitor.js
  
  ai-agent:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: python monitor/AIAgent.py
  
  dashboard:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./monitor:/usr/share/nginx/html
